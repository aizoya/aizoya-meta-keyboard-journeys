name: source-controls
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit-and-http:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - run: node --check public/app.js && node --check public/fixture.js && node --check server.mjs && node --check runner.mjs && node --check meta.mjs
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owned-fixture-browser-evidence
          path: artifacts/
          retention-days: 7
# Browser checks use a scripted planner and owned fixtures, never Meta credits.
