name: keyboard-journey
on: [pull_request]
jobs:
  keyboard-journey:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm start &
      - run: |
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8787/api/status && exit 0
            sleep 1
          done
          exit 1
      - run: |
          cp examples/journey.config.json journey.config.json
          node scripts/ci-target.mjs --config=journey.config.json --check
      - run: node scripts/ci-target.mjs --config=journey.config.json
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          PASSAGE_ENABLE_META: "1"
          PASSAGE_MAX_META_CALLS: "8"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keyboard-journey-evidence
          path: artifacts/ci-target/result.json
